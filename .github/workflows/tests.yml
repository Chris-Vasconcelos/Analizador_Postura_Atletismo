name: Desktop regression tests
on:
  push:
    branches: [main, 'feature/**', 'audit/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Run the CLI with real MediaPipe inference and check its exports
        run: |
          python -m src.cli VID-20251210-WA0139_1.mp4 --end 1 --distance 1 --output smoke-results
          python -m tests.check_session smoke-results
      - name: Compile the Azure job template without an Azure account
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bicep_executable="$RUNNER_TEMP/bicep"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/Azure/bicep/releases/download/v0.49.2/bicep-linux-x64 \
            --output "$bicep_executable"
          echo "0ab9de90c2493f206f8281bae74f9ee2d5ed3605548dab1adf41fef185e1f7c5  $bicep_executable" | sha256sum --check
          chmod +x "$bicep_executable"
          "$bicep_executable" build --no-restore infra/azure/analysis-job.bicep --outfile "$RUNNER_TEMP/analysis-job.json"
      - name: Build the analysis container
        if: runner.os == 'Linux'
        run: docker build --platform linux/amd64 -t sprint-biomech:ci .
      - name: Run the analysis container without network access
        if: runner.os == 'Linux'
        shell: bash
        run: |
          container=$(docker create --network none --cpus 1 --memory 2g \
            --mount "type=bind,source=$PWD/VID-20251210-WA0139_1.mp4,target=/data/sample.mp4,readonly" \
            sprint-biomech:ci /data/sample.mp4 --output /data/output)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker start --attach "$container"
          docker cp "$container:/data/output" container-results
          python -m tests.check_session container-results 209
